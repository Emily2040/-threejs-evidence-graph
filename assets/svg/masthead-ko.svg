  <text x="48" y="338" fill="#8A99AD" font-family="'JetBrains Mono', Consolas, 'Pretendard', monospace" font-size="11" font-weight="600" letter-spacing="0.8">총 217쪽 엔지니어링 규격 · THREE.JS r185 (0.185.0) · 외부 바이너리 에셋 제로 · 21종 에이전트 카드</text>
