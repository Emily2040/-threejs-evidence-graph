<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 356" width="100%" role="img" aria-label="Three.js 에비던스 그래프 &amp; 멀티 장르 프로덕션 스위트 - 4권의 엔지니어링 규격서 · 3종의 무에셋 버티컬 슬라이스 · 4개국어 네이티브 기술 문서">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B11"/>
      <stop offset="55%" stop-color="#0C131D"/>
      <stop offset="100%" stop-color="#091019"/>
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49B4B"/>
      <stop offset="50%" stop-color="#45B29D"/>
      <stop offset="100%" stop-color="#38C6D9"/>
    </linearGradient>
    <pattern id="archGrid" width="42" height="42" patternUnits="userSpaceOnUse">
