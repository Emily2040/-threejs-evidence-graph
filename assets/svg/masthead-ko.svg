    <circle cx="0" cy="0" r="48" fill="none" stroke="#38C6D9" stroke-width="1.2" stroke-opacity="0.55"/>
    <line x1="-132" y1="0" x2="132" y2="0" stroke="#243447" stroke-width="0.9"/>
