  <g transform="translate(930, 204)">
    <rect x="0" y="0" width="278" height="96" rx="6" fill="#101824" stroke="#243246" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#38C6D9"/>
    <text x="16" y="24" fill="#38C6D9" font-family="'JetBrains Mono', Consolas, 'Pretendard', monospace" font-size="11" font-weight="700" letter-spacing="1.2">제4권 · 36쪽</text>
    <text x="264" y="24" fill="#8A99AD" font-family="'JetBrains Mono', Consolas, 'Pretendard', monospace" font-size="10.5" font-weight="600" text-anchor="end">1인칭 SF 슈팅 어드벤처</text>
    <text x="16" y="52" fill="#F8FAFC" font-family="'Noto Serif KR', 'Source Han Serif KR', 'Batang', serif" font-size="17.5" font-weight="700">《근일점 돌파》</text>
    <text x="16" y="76" fill="#94A3B8" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500">Soren Kestrel · 자기 그래플 기동 · 액티브 방열 재장전</text>
