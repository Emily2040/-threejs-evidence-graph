    <text x="16" y="24" fill="#C89B54" font-family="'JetBrains Mono', Consolas, 'Pretendard', monospace" font-size="11" font-weight="700" letter-spacing="1.2">제3권 · 36쪽</text>
    <text x="264" y="24" fill="#8A99AD" font-family="'JetBrains Mono', Consolas, 'Pretendard', monospace" font-size="10.5" font-weight="600" text-anchor="end">1인칭 미스터리 호러</text>
    <text x="16" y="52" fill="#F8FAFC" font-family="'Noto Serif KR', 'Source Han Serif KR', 'Batang', serif" font-size="17.5" font-weight="700">《유리 납골당》</text>
    <text x="16" y="76" fill="#94A3B8" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500">Clara Vane · 음향 포렌식 장비 · 6노드 추리 보드</text>
