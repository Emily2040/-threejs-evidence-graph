  <text x="48" y="92" fill="#F8FAFC" font-family="'Noto Serif KR', 'Source Han Serif KR', 'Batang', serif" font-size="40" font-weight="700" letter-spacing="-0.4">Three.js 에비던스 그래프 &amp; 멀티 장르 프로덕션 스위트</text>
  <text x="48" y="134" fill="#38C6D9" font-family="'Noto Serif KR', 'Source Han Serif KR', 'Batang', serif" font-size="28" font-weight="600">4권의 엔지니어링 규격서 · 3종의 무에셋 버티컬 슬라이스 · 4개국어 네이티브 기술 문서</text>

