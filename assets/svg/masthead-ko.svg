    <text x="16" y="52" fill="#F8FAFC" font-family="'Noto Serif KR', 'Source Han Serif KR', 'Batang', serif" font-size="17.5" font-weight="700">Evidence Graph v2.0</text>
    <text x="16" y="76" fill="#94A3B8" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500">15노드 DAG · 이중 결정론 레짐 · 3대 JSON 스키마</text>
