<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <pattern id="vellum-grid-zh-CN" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5DEC9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Warm Archival Vellum Background -->
  <rect width="1200" height="350" fill="#F5F0E6"/>
  <rect width="1200" height="350" fill="url(#vellum-grid-zh-CN)"/>

  <!-- Subtle Right-Side Horological Astrolabe Drafting Lines -->
  <g transform="translate(1010, 145)" opacity="0.28">
    <circle cx="0" cy="0" r="135" fill="none" stroke="#8C6239" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#1B435D" stroke-width="1.2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#B83227" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#151412" stroke-width="1.5"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#8C6239" stroke-width="1"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#8C6239" stroke-width="1"/>
    <line x1="-110" y1="-110" x2="110" y2="110" stroke="#1B435D" stroke-width="0.8"/>
    <line x1="-110" y1="110" x2="110" y2="-110" stroke="#B83227" stroke-width="0.8"/>
  </g>

  <!-- Double Copperplate Monograph Border -->
  <rect x="16" y="16" width="1168" height="318" fill="none" stroke="#B5A690" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="302" fill="none" stroke="#D5CBB8" stroke-width="1"/>

  <!-- Top Editorial Spine Rule (Cinnabar + Prussian Blue + Ochre) -->
  <rect x="16" y="16" width="760" height="8" fill="#B83227"/>
  <rect x="776" y="16" width="240" height="8" fill="#1B435D"/>
  <rect x="1016" y="16" width="168" height="8" fill="#A84B24"/>

  <!-- Corner Registration Marks -->
  <g stroke="#151412" stroke-width="1.5">
    <path d="M 8 16 L 24 16 M 16 8 L 16 24"/>
    <path d="M 1176 16 L 1192 16 M 1184 8 L 1184 24"/>
    <path d="M 8 334 L 24 334 M 16 326 L 16 342"/>
    <path d="M 1176 334 L 1192 334 M 1184 326 L 1184 342"/>
  </g>

  <!-- Kicker & Cinnabar Seal -->
  <text x="48" y="56" font-family="'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#B83227" letter-spacing="1.2">EMILY PARADOX 典藏工程档案  //  四卷本工业级设定集与架构法典  //  RELEASE 2026.07.5</text>
  <rect x="890" y="38" width="262" height="28" fill="#B83227"/>
  <text x="1021" y="57" text-anchor="middle" font-family="'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace" font-size="12" font-weight="700" fill="#FAF6EE" letter-spacing="0.8">全四卷 217 页 · 零外部运行时资产</text>
  <line x1="48" y1="74" x2="1152" y2="74" stroke="#C8BCA8" stroke-width="1.2"/>

  <!-- Main Monograph Display Title -->
  <text x="48" y="128" font-family="'Georgia', 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Yu Mincho', 'Hiragino Mincho ProN', 'Batang', serif" font-size="40" font-weight="700" fill="#151412">Three.js 证据图谱与三大零资产</text>
  <text x="48" y="178" font-family="'Georgia', 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Yu Mincho', 'Hiragino Mincho ProN', 'Batang', serif" font-size="40" font-weight="700" fill="#151412">旗舰级原生网页游戏工程规范全集</text>

  <!-- Subtitle -->
  <text x="48" y="214" font-family="'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', sans-serif" font-size="15.5" font-weight="500" fill="#4A433B">15 节点确定性多智能体编排图谱（N00..N14）、Three.js r185 WebGPU + TSL 程序化材质与 60 Hz 帧精确切片规范。</text>

  <line x1="48" y1="234" x2="1152" y2="234" stroke="#C8BCA8" stroke-width="1.2"/>

  <!-- Four Volume Index Stamps -->
  <g transform="translate(48, 248)">
    <rect x="0" y="0" width="264" height="62" fill="#EAE1D0" stroke="#B5A690" stroke-width="1.2"/>
    <rect x="0" y="0" width="7" height="62" fill="#B83227"/>
    <text x="18" y="24" font-family="'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#B83227">第一卷 · 架构总控手册 (64页)</text>
    <text x="18" y="47" font-family="'Georgia', 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Yu Mincho', 'Hiragino Mincho ProN', 'Batang', serif" font-size="15" font-weight="700" fill="#151412">《Three.js 证据图谱 v2.0》</text>
  </g>

  <g transform="translate(328, 248)">
    <rect x="0" y="0" width="264" height="62" fill="#EAE1D0" stroke="#B5A690" stroke-width="1.2"/>
    <rect x="0" y="0" width="7" height="62" fill="#A84B24"/>
    <text x="18" y="24" font-family="'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#A84B24">第二卷 · 暗黑动作 RPG (81页)</text>
    <text x="18" y="47" font-family="'Georgia', 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Yu Mincho', 'Hiragino Mincho ProN', 'Batang', serif" font-size="15" font-weight="700" fill="#151412">《虚空子午线》</text>
  </g>

  <g transform="translate(608, 248)">
    <rect x="0" y="0" width="264" height="62" fill="#EAE1D0" stroke="#B5A690" stroke-width="1.2"/>
    <rect x="0" y="0" width="7" height="62" fill="#17565E"/>
    <text x="18" y="24" font-family="'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#17565E">第三卷 · 悬疑恐怖调查 (36页)</text>
    <text x="18" y="47" font-family="'Georgia', 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Yu Mincho', 'Hiragino Mincho ProN', 'Batang', serif" font-size="15" font-weight="700" fill="#151412">《琉璃骸骨堂》</text>
  </g>

  <g transform="translate(888, 248)">
    <rect x="0" y="0" width="264" height="62" fill="#EAE1D0" stroke="#B5A690" stroke-width="1.2"/>
    <rect x="0" y="0" width="7" height="62" fill="#D6451B"/>
    <text x="18" y="24" font-family="'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#D6451B">第四卷 · 科幻射击冒险 (36页)</text>
    <text x="18" y="47" font-family="'Georgia', 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Yu Mincho', 'Hiragino Mincho ProN', 'Batang', serif" font-size="15" font-weight="700" fill="#151412">《近日点破袭》</text>
  </g>
</svg>
