<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 348" width="100%" role="img" aria-label="15노드 결정론적 에비던스 그래프 토폴로지 (N00 .. N14) 및 3대 장르 버티컬 슬라이스 아키텍처">
